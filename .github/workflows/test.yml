name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  japan-castles-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/japan-castles-map
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      - run: npm test -- --coverage
      - run: npx tsc --noEmit

  michi-no-eki-magnets:
    runs-on: ubuntu-latest
