name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  japan-castles-map:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/japan-castles-map
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      - run: npm test -- --coverage
      - run: npx tsc --noEmit

  michi-no-eki-magnets:
    runs-on: ubuntu-24.04
